<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Out</title>
  <link rel="stylesheet" href="bootstrapCSS.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <nav class="navbar navbar-expand-sm bg-dark navbar-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand btn btn-outline-primary" href="Shein.html">Shein</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="collapsibleNavbar">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="Shopping.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="LogIn.html">LogIn</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Clothes
              Shopping</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="Men.html" class="active">Men</a></li>
              <li><a class="dropdown-item" href="Women.html">Women</a></li>
              <li><a class="dropdown-item" href="Kids.html">Kids</a></li>
            </ul>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="CheckOut.html" >CheckOut</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <h2 >Checkout</h2>

      <h4>Shipping Information</h4>
      <form>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" placeholder="Please enter your full name">
        </div>
        <div class="mb-3">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" placeholder="123 Main St">
        </div>
        <div class="row">
          <div class="col mb-3">
            <label class="form-label">City</label>
            <input type="text" class="form-control">
          </div>
          <div class="col mb-3">
            <label class="form-label">Zip Code</label>
            <input type="text" class="form-control">
          </div>
        </div>

        <h4 class="mt-4">Payment Method</h4>
        <div class="alert alert">
          💵 Cash on Delivery — Pay when your order arrives at your door.
        </div>
      </form>

      <h4 class="mt-4">Order Summary</h4>
      <div class="card">
        <div class="card-body">
          <ul class="list-group list-group-flush mb-3">
            <li class="list-group-item d-flex justify-content-between fw-bold">
              Total <span>$00.00</span>
            </li>
          </ul>
          <button class="btn btn-dark w-100">Place Order</button>
        </div>
      </div>

    </div>
  </div>
</div>

<footer class="bg-dark text-light text-center py-3 ">
  <p class="mb-0">&copy; 2026 Shein. All Rights Reserved.</p>
</footer>
</body>

</html>
